services:
  postgres:
    image: postgres:16-alpine
    container_name: streamly_pg
    environment:
      POSTGRES_USER: streamly
      POSTGRES_PASSWORD: streamly_pw
      POSTGRES_DB: streamly_analytics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - streamly_pgdata:/var/lib/postgresql/data
      - ./init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamly -d streamly_analytics"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - streamly_net

volumes:
  streamly_pgdata:
    name: streamly_pgdata

networks:
  streamly_net:
    name: streamly_net
